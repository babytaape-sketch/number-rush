
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>NUMBER RUSH</title>
  <link rel="stylesheet" href="/static/style.css?v=9">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">NUMBER<span>RUSH</span></div>
      <div class="wallet">🪙 <b id="coins">—</b></div>
    </header>

    <section class="hero">
      <div class="eyebrow">YOUR NEXT RARE DROP</div>
      <h1>Твой номер.<span>Твоя коллекция.</span></h1>

      <div class="plate" id="plate">
        <div class="plate-main">А777АА</div>
        <div class="plate-region">
          <div class="region-code">77</div>
          <div class="region-country">RUS</div>
          <div class="region-flag">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>

      <div class="rarity" id="rarity">ГОТОВ К ЗАПУСКУ</div>

      <button id="spin">
        ГЕНЕРИРОВАТЬ <span>↗</span>
      </button>

      <p class="hint" id="hint">У тебя <b id="spins">—</b> попыток</p>
      <p class="hint" id="free-spin-status">Проверяем бесплатный спин...</p>
    </section>

    <nav>
      <button class="tab active" data-tab="collection">Коллекция</button>
      <button class="tab" data-tab="market">Рынок</button>
    </nav>

    <section id="collection" class="panel">
      <h2>Моя коллекция</h2>
      <div id="items" class="items">Загрузка...</div>
    </section>

    <section id="market" class="panel hidden">
      <h2>Рынок игроков</h2>
      <div id="market-items" class="items">Загрузка...</div>
    </section>

    <footer>NUMBER RUSH <span>•</span> COLLECT YOUR STYLE</footer>
  </div>

  <script src="/static/app.js?v=8"></script>
</body>
</html>
